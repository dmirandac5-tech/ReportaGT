apiVersion: apps/v1
kind: Deployment
metadata:
  name: reportagt
  namespace: dmirandac5
  labels:
    app: reportagt
spec:
  replicas: 1
  # Recreate (no RollingUpdate): el volumen es ReadWriteOnce y SQLite es
  # de un solo escritor, así que no debe haber dos pods montándolo a la vez.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reportagt
  template:
    metadata:
      labels:
        app: reportagt
    spec:
      # El volumen nace con dueño root y la app corre como usuario "node" (uid 1000):
      # este paso previo crea las carpetas y le da permisos antes de arrancar la app.
      initContainers:
        - name: preparar-volumen
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/uploads /data/dbdata && chown -R 1000:1000 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: reportagt
          image: mirandd/reportagt:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: reportagt-secrets
          env:
            - name: PORT
              value: "3000"
            - name: DB_FILE
              value: /app/dbdata/reportagt.db
          volumeMounts:
            - name: data
              mountPath: /app/uploads
              subPath: uploads
            - name: data
              mountPath: /app/dbdata
              subPath: dbdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reportagt-data
