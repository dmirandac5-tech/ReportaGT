apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reportagt
  namespace: dmirandac5
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  # Dominio principal: reportagt.duckdns.org
  # Se conserva el anterior para que sigan funcionando los enlaces ya compartidos (PDF, correos)
  tls:
    - hosts:
        - reportagt.duckdns.org
        - dmirandac5-reportagt.duckdns.org
      secretName: reportagt-tls
  rules:
    - host: reportagt.duckdns.org
      http: &ruta
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reportagt
                port:
                  number: 80
    - host: dmirandac5-reportagt.duckdns.org
      http: *ruta
